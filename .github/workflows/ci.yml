name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r gateway/requirements.txt
      - run: npm run build
      - run: npm test
      - run: npm run configure:local -- --generate
      - run: npm run db:local
      - name: Exercise local Cloudflare API and connector
        shell: bash
        run: |
          npm run dev > /tmp/parmakizi-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python scripts/wait_api.py
          npm run test:integration
      - name: Native desktop smoke test
        run: xvfb-run -a python -m unittest discover -s tests_desktop -v
