name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['gateway/**', 'desktop_entry.py', 'updater_entry.py', 'tests_desktop/**', 'tests_windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CLOUD_API_URL: ${{ vars.CLOUD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gateway/requirements.txt pyinstaller==6.20.0
      - name: Set public cloud endpoint
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          defaults = Path('gateway/defaults.json')
          url = os.environ.get('CLOUD_API_URL', '').strip() or json.loads(defaults.read_text(encoding='utf-8')).get('cloud_url', '')
          if url:
              parsed = urlsplit(url)
              assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password and not parsed.query and not parsed.fragment and parsed.path in ('', '/'), 'CLOUD_API_URL must be an HTTPS origin'
          defaults.write_text(json.dumps({'cloud_url': url}), encoding='utf-8')
      - name: Test connector and Windows credential protection
        run: python -m unittest discover -s gateway/tests -v
      - name: Test native desktop
        run: python -m unittest discover -s tests_desktop -v
      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ParmakiziUpdater --add-data "gateway/update-key.pem;gateway" updater_entry.py
          pyinstaller --noconfirm --clean --onefile --windowed --name Parmakizi --collect-all zk --collect-all tzdata --add-data "gateway/defaults.json;gateway" --add-data "gateway/update-key.pem;gateway" desktop_entry.py
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          foreach ($name in @('Parmakizi.exe', 'ParmakiziUpdater.exe')) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content -Encoding ascii "dist/$name.sha256"
          }
      - name: Verify packaged updater dependencies and public key
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'dist/helper-self-test.json'
          $helper = Start-Process -FilePath dist/ParmakiziUpdater.exe -ArgumentList @('--self-test-report', ('"{0}"' -f $report)) -PassThru
          if (-not $helper.WaitForExit(30000)) { Stop-Process -Id $helper.Id -Force; throw 'Updater self-test timed out' }
          if ($helper.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Updater self-test failed' }
      - name: Verify the packaged EXE opens and reaches the live API
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'dist/self-test.json'
          $app = Start-Process -FilePath dist/Parmakizi.exe -ArgumentList @('--self-test-report', ('"{0}"' -f $report)) -PassThru
          if (-not $app.WaitForExit(90000)) {
            Stop-Process -Id $app.Id -Force
            throw 'Packaged EXE smoke test timed out'
          }
          if ($app.ExitCode -ne 0) { throw 'Packaged EXE smoke test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.windows_dpapi -or $result.anonymous_http_status -ne 401) {
            throw 'Packaged EXE did not verify its UI, cloud connection and credential protection'
          }
          Write-Output 'Packaged Windows EXE: UI startup, HTTPS API, anonymous access rejection and DPAPI passed.'
      - name: Test Windows installation and rollback against the frozen executable
        env:
          TEST_FROZEN_EXE: dist/Parmakizi.exe
          TEST_FROZEN_UPDATER: dist/ParmakiziUpdater.exe
        run: python -m unittest discover -s tests_windows -v
      - name: Include source and notices with the internal build
        shell: pwsh
        run: |
          git archive HEAD --format=zip -o dist/Parmakizi-source.zip
          Copy-Item THIRD_PARTY_NOTICES.md dist/
          Copy-Item docs/licenses dist/licenses -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Parmakizi-Windows-x64
          path: |
            dist/Parmakizi.exe
            dist/Parmakizi.exe.sha256
            dist/ParmakiziUpdater.exe
            dist/ParmakiziUpdater.exe.sha256
            dist/self-test.json
            dist/helper-self-test.json
            dist/Parmakizi-source.zip
            dist/THIRD_PARTY_NOTICES.md
            dist/licenses/
          if-no-files-found: error
  publish-update:
    if: vars.ENABLE_UPDATE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r gateway/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: Parmakizi-Windows-x64
          path: windows-artifact
      - run: python scripts/prepare_cloud.py
      - run: npm run db:remote
      - run: python scripts/publish_update.py --artifact windows-artifact --notes "Otomatik Windows sürümü"
